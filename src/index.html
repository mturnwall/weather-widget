<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Weather Widget</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div id="wrapper">
            <section class="current">
                <h1 class="current__location">Santee</h1>
                <div class="current__temp">78</div>
                <div class="current__condition">Cloudy</div>
                <div class="current__temp-range">
                    <span class="current__high">H: 80°</span>
                    <span class="current__low">L: 64°</span>
                </div>
            </section>
        </div>
    </body>
</html>
